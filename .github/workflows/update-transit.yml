name: Greece Transit Network & Timetable Scraper

on:
  schedule:
    # Runs weekly on Sunday at 03:00 UTC (early morning maintenance)
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transit-updater
  cancel-in-progress: false

jobs:
  scrape-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape transit lines, stops & photography
        run: python scraper.py

      - name: Package dataset & compress artifacts
        run: python package_dataset.py

      - name: Commit updated master registries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(data): sync transit network & bus routes [skip ci]"
          git push || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat tag.txt)
          gh release create "$TAG" \
            transit_network.min.json \
            transit_network.min.json.zst \
            transit_network.min.json.gz \
            metro_timetables.min.json \
            metro_timetables.min.json.zst \
            metro_timetables.min.json.gz \
            bus_routes_index.min.json \
            bus_routes_index.min.json.zst \
            bus_routes_index.min.json.gz \
            ktel_dataset.min.json \
            ktel_dataset.min.json.zst \
            ktel_dataset.min.json.gz \
            --title "Greece Transit Dataset $TAG" \
            --notes-file release_notes.md \
            --latest

